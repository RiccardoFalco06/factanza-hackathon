<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#86c4ff">
<title>Factanza · demo</title>
<link rel="icon" href="../assets/factanza-f.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">

<link rel="stylesheet" href="../tokens.css">

<body>
<!-- Demo per l'Hackathon Factanza: va aperta dal server (npm start), contenuti di esempio. Su telefono è a tutto schermo, su computer è una colonna da telefono. -->
<div class="phone">
  <main id="view" tabindex="-1"></main>
  <div id="mini" class="mini" hidden></div>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home"><i class="ph-bold ph-house" aria-hidden="true"></i><span>Home</span></a>
    <a href="#/listen" data-tab="listen"><i class="ph-bold ph-headphones" aria-hidden="true"></i><span>Listen</span></a>
    <a href="#/play" data-tab="play"><i class="ph-bold ph-game-controller" aria-hidden="true"></i><span>Play</span></a>
    <a href="#/learn" data-tab="learn"><i class="ph-bold ph-graduation-cap" aria-hidden="true"></i><span>Learn</span></a>
    <a href="#/you" data-tab="you"><i class="ph-bold ph-user" aria-hidden="true"></i><span>You</span></a>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="data.js"></script>
<script src="demo.js"></script>
</body>
</html>
